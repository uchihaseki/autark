[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autark"
version = "0.1.0"
description = "A safe, auditable agent self-improvement framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "shuo"}
]
keywords = [
  "agent",
  "evaluation",
  "self-improvement",
  "evolution",
  "prompt-engineering",
  "ai-safety",
  "audit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/shuo/autark"
Repository = "https://github.com/shuo/autark"
Issues = "https://github.com/shuo/autark/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
autark = "autark.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
