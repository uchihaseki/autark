[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autark"
version = "0.1.0"
description = "Autonomous-Turing Adaptive Reinforcement Kernel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "loguru>=0.7",
]

[project.scripts]
autark = "autark.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
