[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autark"
version = "0.2.0"
description = "A safe, auditable agent self-improvement framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "shuo"}
]
keywords = [
  "agent",
  "evaluation",
  "self-improvement",
  "evolution",
  "prompt-engineering",
  "ai-safety",
  "audit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/shuo/autark"
Repository = "https://github.com/shuo/autark"
Issues = "https://github.com/shuo/autark/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.10",
]
anthropic = [
  "anthropic>=0.49",
]

[project.scripts]
autark = "autark.cli.main:main"

[project.entry-points."autark.adapters"]
fake = "autark.adapters.fake:FakeAdapter"
prompt-agent = "autark.adapters.prompt_agent:PromptAgentAdapter"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["autark"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
